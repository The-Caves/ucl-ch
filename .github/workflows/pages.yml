name: Publish Cornhole Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/public
          cp index.html manifest.webmanifest _site/
          cp public/ucl-mark.svg _site/public/
          cp src/app.js src/brand.js src/engine.js src/scoring.js src/scorecard.js src/demo.js src/bracket-layout.js src/season-history.js src/player-statistics.js src/styles.css _site/src/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/app.js
          test -s _site/src/demo.js
          test -s _site/src/season-history.js
          test -s _site/src/player-statistics.js
          find _site -maxdepth 3 -type f -print
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
